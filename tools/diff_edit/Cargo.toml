
// Cargo.toml
[package]
name = "intelligent-diff"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "An intelligent diff tool with LLM integration"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
git2 = "0.18"
similar = "2.4"
colored = "2.1"
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
tera = "1.19"
thiserror = "1.0"
tracing = "0.1"
tree-sitter = "0.20"
futures = "0.3"
clap = { version = "4.3", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"
tempfile = "3.8"
assert_fs = "1.0"
predicates = "3.0"

[[example]]
name = "basic_diff"
path = "examples/basic_diff.rs"

[[example]]
name = "llm_analysis"
path = "examples/llm_analysis.rs"
